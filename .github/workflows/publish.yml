name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for npm trusted publishing via OIDC

    steps:
      - uses: actions/checkout@v6

      - name: Install wasm target
        run: |
          rustup target add wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: node/package-lock.json

      - name: Get wasm-bindgen version
        id: wasm-bindgen-version
        run: |
          VERSION=$(grep -A 1 'name = "wasm-bindgen"' Cargo.lock | grep version | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen-version.outputs.version }}

      - name: Install npm dependencies
        working-directory: node
        run: npm ci

      - name: Build WASM
        working-directory: node
        run: npm run build

      - name: Run tests
        working-directory: node
        run: npm test

      - name: Publish to npm
        working-directory: node
        run: npm publish --access public
